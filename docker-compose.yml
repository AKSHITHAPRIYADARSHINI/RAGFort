services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://ragfort@postgres:5432/ragfort
      # The browser-visible issuer remains localhost while the API resolves
      # signing keys over Docker's internal network.
      OIDC_ISSUER: http://localhost:8080/realms/ragfort-local
      OIDC_JWKS_URL: http://keycloak:8080/realms/ragfort-local/protocol/openid-connect/certs
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ragfort
      POSTGRES_USER: ragfort
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragfort -d ragfort"]
      interval: 10s
      timeout: 5s
      retries: 10
  keycloak:
    # Development-only OIDC integration. Bootstrap credentials and synthetic
    # user passwords live exclusively in the ignored .env.keycloak.local.
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start-dev", "--http-port=8080"]
    env_file:
      - path: .env.keycloak.local
        required: false
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  qdrant_data:
  postgres_data:
